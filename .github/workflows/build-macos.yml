name: 构建 macOS DMG

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 读取版本号
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 打包 .app
        env:
          PY: python3
        run: bash packaging/build_app.sh

      - name: 生成 DMG
        run: bash packaging/build_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: AVCAD-macOS-${{ steps.ver.outputs.version }}
          path: dist/*.dmg

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
