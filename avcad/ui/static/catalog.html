<!DOCTYPE html>

<title>AVCAD · 图例库校正</title>
<style>
/* ============================================================
   设计令牌（与 index.html 同源：深空 / 霓虹 / 影院感）
   图例库校正页与图例确认卡同语言：.legend + .lg-rows + .prow

   ★ 语义（阳哥 2026-09-01）：
     这页只改**图例库**；主库（eko_catalog）的类别 / 特性 / 参数在此**只读展示**。
     列表 = 图例库已有 ∪ 主库里尚未被图例覆盖的可出图产品。
     每条保存走 /api/legend，落完由 R10 自动把物理端口数反推回主库。
   ============================================================ */
:root{
  --bg:#03050b; --panel:rgba(255,255,255,.028); --panel2:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.14);
  --txt:#f3f6ff; --mut:#6f7e9a;
  --acc:#00e5ff; --acc2:#a855f7; --acc3:#f472b6;
  --ok:#2ee8a0; --warn:#f0b45f; --err:#ff5a6e;
  --shadow-card:0 34px 80px -46px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.035),
                 inset 0 1px 0 rgba(255,255,255,.045);
  --glow-acc:0 0 0 1px rgba(0,229,255,.18), 0 0 42px -12px rgba(0,229,255,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:13px;line-height:1.55;letter-spacing:.014em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  /* 星空 + 星云辉光（与 index.html 一致） */
  background-image:
    radial-gradient(1.3px 1.3px at 24px 30px, rgba(255,255,255,.45), transparent 100%),
    radial-gradient(1px 1px at 132px 92px, rgba(160,230,255,.40), transparent 100%),
    radial-gradient(1.5px 1.5px at 68px 162px, rgba(255,255,255,.26), transparent 100%),
    radial-gradient(1px 1px at 196px 200px, rgba(210,190,255,.34), transparent 100%),
    radial-gradient(1.1px 1.1px at 240px 44px, rgba(255,180,225,.30), transparent 100%),
    radial-gradient(880px 520px at 8% -14%, rgba(0,229,255,.13), transparent 68%),
    radial-gradient(780px 460px at 96% 2%, rgba(168,85,247,.13), transparent 68%),
    radial-gradient(900px 520px at 58% 116%, rgba(244,114,182,.09), transparent 68%);
  background-size:264px 264px, 264px 264px, 264px 264px, 264px 264px, 264px 264px,
                   auto, auto, auto;
  background-attachment:fixed;
  background-color:var(--bg);
  padding:24px 30px 80px;min-height:100vh;
}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.14em;
   background:linear-gradient(92deg,#ffffff 8%,#9beeff 42%,#d9b6ff 72%,#ffc2e2 100%);
   -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:11.5px;margin-top:4px;letter-spacing:.06em}

/* 顶栏筛选 */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0;
    padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);
    backdrop-filter:blur(10px)}
.bar label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:11.5px;letter-spacing:.08em}
.bar select,.bar input[type=text]{height:30px;font-size:12.5px;
  background:rgba(6,9,18,.7);color:var(--txt);
  border:1px solid var(--line);border-radius:9px;padding:0 10px;outline:none}
.bar select:focus,.bar input:focus{border-color:var(--acc)}
.bar .grow{flex:1;display:flex;gap:6px;align-items:center}
.bar input[type=text]{flex:1}
.feat{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);font-size:11.5px;cursor:pointer;user-select:none;color:var(--mut);
  background:rgba(255,255,255,.03);letter-spacing:.06em}
.feat.on{background:rgba(0,229,255,.14);border-color:var(--acc);color:var(--acc)}
.count{color:var(--mut);font-size:11.5px;letter-spacing:.04em}
.count b{color:var(--txt);font-weight:600}

/* 按钮库（与 index.html 同款） */
button{cursor:pointer;font-family:inherit;font-size:12px;border-radius:999px;padding:6px 14px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt);
  transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .25s ease, filter .22s ease}
button:hover{border-color:var(--acc);color:#fff}
button:active{transform:translateY(0)}
button:disabled{opacity:.34;cursor:not-allowed;border-color:var(--line);color:var(--mut)}
button:disabled:hover{border-color:var(--line);color:var(--mut)}
button.ghost{background:rgba(255,255,255,.035);border:1px solid var(--line-strong);color:var(--txt);font-weight:500}
button.sec{background:linear-gradient(96deg,rgba(46,232,160,.95),rgba(0,190,190,.92));
  color:#02150f;border:1px solid rgba(160,255,230,.45);font-weight:700;
  box-shadow:0 14px 30px -16px rgba(46,232,160,.85), inset 0 1px 0 rgba(255,255,255,.35)}
button.sec:hover{filter:brightness(1.07);border-color:var(--ok)}

/* ============================================================
   卡片（与图例卡 100% 同构：.legend + .th + .lg-rows + .prow）
   ============================================================ */
.legend{border:1px solid var(--line);border-radius:15px;padding:12px;
  margin-bottom:10px;background:var(--panel2);
  transition:border-color .25s ease, box-shadow .3s ease}
.legend:hover{border-color:var(--line-strong);box-shadow:0 16px 38px -26px rgba(0,0,0,.95)}
.legend.changed{border-color:rgba(240,180,95,.5);
  box-shadow:inset 0 0 0 1px rgba(240,180,95,.18)}
.legend .th{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.legend .th .left{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.legend .th b{font-size:14px;font-weight:600;color:var(--txt)}
.legend .th .mut{color:var(--mut);font-size:12px}
.legend .cache{font-size:11px;letter-spacing:.05em}
.legend .cache.hit{color:var(--ok)}
.legend .cache.miss{color:var(--warn)}
.legend .cache.dirty{color:var(--warn)}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:11px;border:1px solid var(--line-strong);letter-spacing:.04em;background:rgba(255,255,255,.03)}
.badge.hit{color:var(--ok);border-color:rgba(46,232,160,.5);background:rgba(46,232,160,.09)}
.badge.miss{color:var(--warn);border-color:rgba(240,180,95,.5);background:rgba(240,180,95,.08)}
.badge.mut{color:var(--mut)}

/* 元信息行（卡顶直显摘要） */
.kv{font-size:12px;color:var(--mut);margin:6px 0 4px;letter-spacing:.03em}

/* ============================================================
   核心编辑区——与图例端口行同构：.lg-rows + .prow
   ============================================================ */
.section-label{
  display:flex;align-items:center;gap:8px;margin:10px 0 4px;
  color:var(--mut);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.section-label::after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--line),transparent)}

.lg-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.lg-rows .prow{
  display:flex;align-items:center;gap:5px;margin:0;flex-wrap:wrap;padding:4px 6px;
  border:1px solid var(--line);border-radius:9px;background:rgba(4,7,14,.4);
  min-height:33px}
.lg-rows .prow:hover{border-color:rgba(0,229,255,.25)}
/* R15：图例校正页手工添加型号的知识库识别建议 */
.kbhint{margin:8px 0 2px;font-size:12px;line-height:1.55;color:#9fb3c8;
  background:rgba(255,255,255,.035);border-left:3px solid #3a4a5a;
  padding:6px 9px;border-radius:5px}
.kbhint.unknown{color:#ffc457;background:rgba(255,176,32,.10);border-left-color:#ffb020}
.kbhint .mut{color:var(--mut);font-size:11px}
.lg-rows .prow select,.lg-rows .prow input[type=text]{
  height:28px;font-size:11.5px;padding:0 7px;border-radius:7px;
  background:rgba(6,9,18,.85);color:var(--txt);border:1px solid var(--line);
  outline:none;font-family:inherit}
.lg-rows .prow select:focus,.lg-rows .prow input[type=text]:focus{border-color:var(--acc)}
.lg-rows .prow select.cat{min-width:120px;max-width:140px;font-weight:600;color:var(--acc)}
.lg-rows .prow select.feat{min-width:80px;max-width:110px}
.lg-rows .prow input.key{flex:1;min-width:90px;max-width:140px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lg-rows .prow input.val{flex:1;min-width:60px;max-width:120px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right}
.lg-rows .prow input.remark{flex:1;min-width:120px}
/* R12 手工添加型号：标题行的品牌 / 型号输入框 */
input.inp-mini{background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--txt);
  border-radius:6px;padding:3px 7px;font-size:12.5px;font-family:inherit}
input.inp-mini:focus{outline:none;border-color:var(--acc)}
input.inp-mini#brand_input_0,input.inp-mini[id^=brand_input_]{width:96px}
input.inp-mini[id^=model_input_]{width:150px;font-weight:600}
.legend.flash{box-shadow:0 0 0 2px var(--acc)}
.lg-rows .prow button.mini{
  padding:2px 9px;margin:0;font-size:11px;font-weight:700;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);
  cursor:pointer;box-shadow:none}
.lg-rows .prow button.mini:hover{border-color:var(--acc);color:#fff}
.lg-rows .prow button.mini.del{color:var(--err)}
.lg-rows .prow span.idx{
  min-width:18px;text-align:center;font-size:10.5px;display:inline-block;color:var(--mut);
  padding:1px 0;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.lg-rows .prow .role{
  display:inline-flex;align-items:center;gap:3px;
  color:var(--mut);font-size:11px;letter-spacing:.03em;padding-left:4px;
  border-left:1px solid var(--line);margin-left:2px}
.lg-rows .prow .role .v{color:var(--txt);font-weight:600}
/* 端口数量（− N ＋）：与图例确认页 renderPortRows 同一语言 */
.lg-rows .prow span.n{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600;font-size:12px}
/* 主库只读信息行：与可编辑行区分开 */
.cat-ro{margin:2px 0 6px;font-size:11.5px;color:var(--mut);line-height:1.7}
.cat-ro code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.04);padding:1px 5px;border-radius:4px}

/* 底部操作行（与图例卡同位） */
.row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.row .grow{flex:1}
.lg-status{font-size:12px;color:var(--mut);min-width:24px;letter-spacing:.04em}
.lg-status.ok{color:var(--ok)} .lg-status.err{color:var(--err)}

/* 提示：每个 section 的快捷插入区 */
.section-tools{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 4px}
.section-tools .preset{
  display:inline-flex;align-items:center;gap:3px;padding:2px 9px;
  border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--mut);
  cursor:pointer;user-select:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.section-tools .preset:hover{border-color:var(--acc);color:var(--acc)}

/* 空态 / toast */
.empty{color:var(--mut);padding:34px;text-align:center;font-size:13px;letter-spacing:.04em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
  background:rgba(12,17,32,.96);border:1px solid var(--line-strong);
  padding:11px 20px;border-radius:999px;font-size:13px;opacity:0;
  transition:opacity .25s ease, transform .25s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;z-index:90;letter-spacing:.03em;
  box-shadow:0 24px 60px -26px rgba(0,0,0,.95), 0 0 0 1px rgba(0,229,255,.14);
  backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(46,232,160,.5)}
.toast.err{border-color:rgba(255,90,110,.5)}

/* 跨库提示 banner——主库 ≠ 图例库 */
.banner{margin:6px 0 14px;padding:12px 16px;border-radius:10px;
  border:1px solid var(--line-strong);
  background:linear-gradient(90deg,rgba(0,229,255,.07),rgba(0,229,255,.02));
  display:flex;gap:14px;align-items:stretch;font-size:12.5px;color:var(--txt);
  letter-spacing:.02em}
.banner .pane{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.banner .pane + .pane{border-left:1px solid var(--line);padding-left:14px}
.banner .pane .hd{font-size:10.5px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;font-weight:600}
.banner .pane b{color:var(--acc)}
.banner .pane code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  color:var(--mut);background:rgba(255,255,255,.04);padding:1px 6px;border-radius:5px;
  border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .vs{align-self:center;font-size:10px;color:var(--mut);letter-spacing:.18em;
  border:1px solid var(--line);padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.02);white-space:nowrap}

/* 图例库命中徽章（卡顶元信息行） */
.lg-hit{display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;letter-spacing:.04em;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--mut);background:rgba(255,255,255,.03);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;margin-left:6px}
.lg-hit.has{border-color:rgba(46,232,160,.5);color:var(--ok);background:rgba(46,232,160,.06)}
.lg-hit .n{color:var(--txt);font-weight:600}

/* R10 反向同步徽章（主库 params 由图例库反推） */
.auto-sync{display:inline-flex;align-items:center;gap:3px;
  font-size:10.5px;letter-spacing:.04em;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line);color:var(--mut);background:rgba(255,255,255,.03);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;margin-left:6px}
.auto-sync.has{border-color:rgba(168,85,247,.5);color:var(--acc2);background:rgba(168,85,247,.07)}
.auto-sync .n{color:var(--txt);font-weight:600}
.auto-sync .d{color:var(--mut);font-weight:400}

/* ============================================================
   资料查询：右侧浮动按钮 + 抽屉（汇总音频知识，可模糊搜索）
   与整页深空 / 霓虹主题同源
   ============================================================ */
.kb-fab{position:fixed;right:0;top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;padding:16px 9px;border-radius:12px 0 0 12px;
  background:linear-gradient(180deg,rgba(0,229,255,.20),rgba(168,85,247,.20));
  border:1px solid var(--line-strong);border-right:none;color:var(--txt);
  font-size:12.5px;letter-spacing:.22em;font-weight:600;cursor:pointer;z-index:80;
  backdrop-filter:blur(8px);box-shadow:var(--shadow-card);
  display:flex;flex-direction:column;align-items:center;gap:7px}
.kb-fab:hover{border-color:var(--acc);color:#fff}
.kb-fab .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 8px var(--acc)}
.kb-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:84;
  opacity:0;pointer-events:none;transition:opacity .25s ease}
.kb-backdrop.show{opacity:1;pointer-events:auto}
.kb-drawer{position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;
  background:rgba(6,9,18,.97);border-left:1px solid var(--line-strong);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  z-index:85;display:flex;flex-direction:column;box-shadow:-30px 0 80px -40px #000}
.kb-drawer.open{transform:translateX(0)}
.kb-head{position:relative;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.kb-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.08em;
  background:linear-gradient(92deg,#9beeff,#d9b6ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.kb-head .sub2{color:var(--mut);font-size:11px;margin-top:3px;letter-spacing:.03em}
.kb-close{position:absolute;top:12px;right:12px;width:28px;height:28px;
  border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--mut);cursor:pointer;font-size:16px;line-height:1}
.kb-close:hover{border-color:var(--acc);color:#fff}
.kb-search{padding:10px 16px 6px}
.kb-search input{width:100%;height:34px;font-size:13px;padding:0 12px;
  background:rgba(6,9,18,.7);color:var(--txt);border:1px solid var(--line);
  border-radius:10px;outline:none;font-family:inherit}
.kb-search input:focus{border-color:var(--acc)}
.kb-chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 10px}
.kb-chip{padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  font-size:11.5px;color:var(--mut);cursor:pointer;user-select:none;background:rgba(255,255,255,.03)}
.kb-chip.on{background:rgba(0,229,255,.14);border-color:var(--acc);color:var(--acc)}
.kb-list{flex:1;overflow-y:auto;padding:6px 14px 24px}
.kb-cat{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
  margin:12px 2px 4px}
.kb-item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  margin-bottom:8px;background:var(--panel2);cursor:pointer;transition:border-color .2s}
.kb-item:hover{border-color:var(--line-strong)}
.kb-item .t{font-size:13px;font-weight:600;color:var(--txt);
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.kb-item .lv{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:999px;letter-spacing:.04em}
.kb-item .lv.ERROR{color:var(--err);border:1px solid rgba(255,90,110,.5);background:rgba(255,90,110,.08)}
.kb-item .lv.WARN{color:var(--warn);border:1px solid rgba(240,180,95,.5);background:rgba(240,180,95,.08)}
.kb-item .lv.INFO{color:var(--acc);border:1px solid rgba(0,229,255,.4);background:rgba(0,229,255,.07)}
.kb-item .tags{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.kb-item .tag{font-size:10px;color:var(--mut);background:rgba(255,255,255,.04);
  border:1px solid var(--line);padding:1px 7px;border-radius:6px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.kb-item .sum{margin-top:6px;font-size:12px;color:#9fb3c8;line-height:1.5}
.kb-item .det{margin-top:8px;font-size:12px;color:var(--mut);line-height:1.65;
  border-top:1px dashed var(--line);padding-top:8px;display:none}
.kb-item.open .det{display:block}
.kb-empty{color:var(--mut);text-align:center;padding:30px;font-size:12.5px;letter-spacing:.03em}
</style>
</head>

<script>
const $ = id => document.getElementById(id);

/* 端口枚举：与 index.html 图例确认页**完全一致**。
   ★ 改这里必须同步那边——两边各有一份是有守卫测试兜底的
     （test_signal_registry.py / test_port_geometry.py）。 */
const SIGNALS = ["XLR","AES","DANTE","RS232","RF","SPEAKER","IP","GPIO","POWER","OPTICAL","TRS","CONF","USB","LINK","WCLK"];
const ROLES = ["in","out","io"];
const SIDES = ["left","right","top","bottom"];

/* 端口类型中文说明：下拉选项旁显示，便于理解每个信号是什么 */
const SIGNAL_HINT = {
  XLR:"卡侬音频", AES:"数字音频", DANTE:"网络音频", RS232:"串口控制",
  RF:"射频无线", SPEAKER:"扬声器", IP:"控制网络", GPIO:"通用IO",
  POWER:"电源", OPTICAL:"光纤音频", TRS:"6.35mm", CONF:"会议总线",
  USB:"USB", LINK:"级联", WCLK:"字时钟"
};
/* signal 下拉：选项文本带中文，但 value 仍是信号码（提交用） */
function sigOpts(val){
  const extra = (val && SIGNALS.indexOf(val) < 0 && /^[\w-]+$/.test(String(val))) ? [val] : [];
  const base = SIGNALS.map(o =>
    '<option value="' + o + '"' + (o === val ? ' selected' : '') + '>' + o + ' · ' + (SIGNAL_HINT[o] || '') + '</option>'
  ).join('');
  const ext = extra.map(o => '<option value="' + o + '" selected>' + o + '</option>').join('');
  return base + ext;
}

let META = {categories:[], features:[]};
let ITEMS = [];
let DIRTY = new Set();   // 已改动未保存
let SAVED = new Set();   // 本会话已落盘
let LEGEND_PATH = "legend_library.json";
let CATALOG_PATH = "eko_catalog.json";

async function api(path, body){
  const r = await fetch(path, {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});
  return await r.json();
}
let tt=null;
function toast(m, kind){
  const t=$("toast"); t.textContent=m;
  t.className="toast show " + (kind||"");
  clearTimeout(tt); tt=setTimeout(()=>t.className="toast", 2200);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* 兜底：当前值不在候选列表里时补成首项并选中，否则一编辑就把原值静默改成首项
   （RS232 曾漏在 SIGNALS 之外，图例里 4 个 RS232 端口一编辑就变成 XLR）。 */
function selOpts(arr, val){
  const opts = (val && arr.indexOf(val) < 0 && /^[\w-]+$/.test(String(val)))
    ? [val].concat(arr) : arr;
  return opts.map(o=>'<option' + (o === val ? " selected" : "") + '>' + o + '</option>').join("");
}

/* ============================================================
   载入：meta（品牌清单 + 两库路径）/ list（图例库 ∪ 主库未覆盖）
   ============================================================ */
async function loadMeta(){
  META = await api("/api/legend-catalog", {action:"meta"});
  const lib = META.library || {};
  LEGEND_PATH  = (lib.path || "legend_library.json").split("/").pop();
  CATALOG_PATH = (META.path || "eko_catalog.json").split("/").pop();
  $("pathLegend").textContent  = LEGEND_PATH;
  $("pathMaster").textContent  = CATALOG_PATH;
  $("meta").innerHTML =
    '主库 <b style="color:var(--txt)">' + (META.total||0) + '</b> 条（其中可出图待筛） · '
    + '<span style="color:var(--ok)">图例库</span> <b style="color:var(--txt)">' + (META.legend_count||0) + '</b> 条已确认';
  const sel = $("brand");
  sel.innerHTML = (META.brands||[]).map(b =>
    `<option value="${esc(b.brand)}">${esc(b.brand)}（${b.count}${b.confirmed?" · 已确认 "+b.confirmed:""}）</option>`).join("");
  const url = new URL(location.href);
  const init = url.searchParams.get("brand");
  sel.value = (init && (META.brands||[]).find(b=>b.brand===init))
    ? init : ((META.brands||[]).find(b=>b.confirmed) || META.brands[0] || {}).brand || "";
}
async function loadItems(){
  const res = await api("/api/legend-catalog", {
    action:"list", brand:$("brand").value, q:$("q").value,
    only_missing: $("fMissing").classList.contains("on"), limit: 300});
  ITEMS = res.items || [];
  DIRTY.clear(); SAVED.clear();
  const nConf = ITEMS.filter(i=>i.source==="legend").length;
  $("count").innerHTML = `共 <b>${ITEMS.length}</b> 条 · 已确认 <b style="color:var(--ok)">${nConf}</b> · 待确认 <b style="color:var(--warn)">${ITEMS.length-nConf}</b>`;
  render();
}

/* ============================================================
   render() ── 与图例卡 .legend 同构
   ============================================================ */
function render(){
  const box = $("list");
  if(!ITEMS.length){ box.innerHTML = `<div class="empty">没有匹配的条目</div>`; return; }
  box.innerHTML = "";
  ITEMS.forEach((it,i)=>box.appendChild(buildCard(i)));
}

function badgeFor(i){
  const it = ITEMS[i];
  /* ★ 四条分支都要带 id="bdg_i"：mark() / saveOne() 是用 outerHTML 整块替换的，
     少了 id 的话徽章一变（待保存 → 已落盘）就再没有 #bdg_i 这个锚点，
     后续按 id 定位徽章的代码（含 e2e）会静默拿到 null。 */
  if(DIRTY.has(i))  return `<span class="cache dirty" id="bdg_${i}">◐ 图例 待保存</span>`;
  if(SAVED.has(i))  return `<span class="cache hit" id="bdg_${i}">● 图例 v${it.revision||1} 已落盘</span>`;
  if(it.source === "new")
    return `<span class="cache miss" id="bdg_${i}">✕ 未建档 · 填品牌/型号 + 加端口后保存</span>`;
  if(it.source === "legend")
    return `<span class="cache hit" id="bdg_${i}">● 图例 v${it.revision||1} · ${esc((it.updated_at||"").slice(0,10))}</span>`;
  if(!it.inferred)
    return `<span class="cache miss" id="bdg_${i}">✕ 无法推断 · 需手工添加端口</span>`;
  return `<span class="cache miss" id="bdg_${i}">○ 引擎推断 · 待确认</span>`;
}

/* 主库侧只读信息 + R10 反推徽章 */
function metaLine(it){
  const cd = it.catalog || null;
  const pr = (cd && cd.params) || {};
  const rev = pr.legend_rev || 0;
  const syn = pr.synced_at || "";
  const agg = ('inputs' in pr) || ('outputs' in pr);
  let autoBadge;
  if(!rev){
    autoBadge = `<span class="auto-sync" title="主库原始自动生成，图例库尚未确认过这个型号">↘ 主库原始（图例未确认）</span>`;
  } else if(agg){
    autoBadge = `<span class="auto-sync has" title="图例库 rev ${rev} 于 ${esc(syn)} 反推主库">↘ 由图例 <b class="n">v${rev}</b> <span class="d">· 进出 ${pr.inputs}/${pr.outputs} · ${esc(syn.slice(0,16).replace('T',' '))}</span></span>`;
  } else {
    autoBadge = `<span class="auto-sync" title="图例库 rev ${rev} 已确认；该类别端口数由 channels / 固定模板决定，主库不存 inputs/outputs">↘ 图例已确认 <b class="n">v${rev}</b> <span class="d">· 端口不聚合</span></span>`;
  }
  const ro = cd
    ? `<div class="cat-ro">主库（只读）：类别 <code>${esc(cd.category||"—")}</code> · 特性 <code>${esc((cd.features||[]).join(",")||"—")}</code> · 参数 <code>${esc(Object.keys(pr).length ? JSON.stringify(pr) : "—")}</code></div>`
    : `<div class="cat-ro">主库（只读）：<code>图例库该类别在主库里没有对应条目</code></div>`;
  const total = (it.ports||[]).reduce((s,p)=>s+(Number(p.count)||0),0);
  return `${ro}<div style="margin-top:2px">端口 <b style="color:var(--txt)">${(it.ports||[]).length}</b> 类 / <b style="color:var(--txt)">${total}</b> 口`
       + `${(it.slots||[]).length ? ` · 卡槽 <b style="color:var(--txt)">${it.slots.length}</b>` : ""}`
       + autoBadge + `</div>`;
}

/* ============================================================
   buildCard() ── 与图例卡 renderLegendCard 同位
   ============================================================ */
function buildCard(i){
  const it = ITEMS[i];
  const isNew = it.source === "new";
  const d = document.createElement("div");
  d.className = "legend"; d.id = "cat_" + i;

  /* ★ 手工添加的型号：品牌 / 型号改成输入框。
     主库没有的型号两边都搜不到（列表 = 图例库 ∪ 主库），
     此前唯一的补救口是第③步图例确认页——但那要等它在实际配单里出现。
     现在可以直接在这里建档，下次配单遇到就自动套用。 */
  const titleInner = isNew
    ? '<input type="text" class="inp-mini" id="brand_input_' + i + '" placeholder="品牌" value="' + esc(it.brand || "") + '"/>' +
      '<input type="text" class="inp-mini" id="model_input_' + i + '" placeholder="型号（必填）" value="' + esc(it.model || "") + '"/>'
    : '<b>' + esc(it.model || it.name) + '</b>' +
      '<span class="mut">· ' + esc(it.brand || "") + '</span>';
  const srcBadge = isNew
    ? `<span class="badge mut" style="font-size:10px">手工新增</span>`
    : (it.source === "legend"
        ? `<span class="badge hit" style="font-size:10px">图例库</span>`
        : `<span class="badge mut" style="font-size:10px">主库未覆盖</span>`);

  d.innerHTML =
    '<div class="th">' +
      '<div class="left">' + titleInner + srcBadge + '</div>' +
      badgeFor(i) +
    '</div>' +

    '<div class="kv" id="kv_' + i + '">' + metaLine(it) + '</div>' +

    /* 类别行（存图例库：同一型号跨类别时以此区分类别） */
    '<div class="lg-rows" style="grid-template-columns:1fr;margin-top:2px">' +
      '<div class="prow">' +
        '<span class="idx">类</span>' +
        '<select class="cat" id="cat_sel_' + i + '" title="图例按 brand::model::类别 存；改类别会以新类别另建一条图例，原条目保留">' +
          (META.categories||[]).map(c =>
            `<option value="${esc(c)}"${c===(it.category||"")?" selected":""}>${esc(c)||"（无）"}</option>`).join("") +
        '</select>' +
        '<span class="mut" style="font-size:11px">→ 图例归属类别（出图时以图例为准）</span>' +
      '</div>' +
    '</div>' +

    /* R15：知识库识别建议（手工添加型号时输入品牌/型号自动出现） */
    '<div class="kbhint" id="kbh_' + i + '"></div>' +

    '<div class="section-label">端口（信号 / 方向 / 侧 / 标签 / 数量）</div>' +
    '<div class="lg-rows" id="port_rows_' + i + '"></div>' +

    '<div class="row">' +
      '<button class="ghost" id="addport_' + i + '" style="margin-top:0;padding:5px 12px;font-size:11.5px">+ 新增端口</button>' +
      '<span class="grow"></span>' +
      '<span class="lg-status" id="st_' + i + '"></span>' +
      '<button class="sec" id="ok_' + i + '" style="margin-top:0;padding:6px 18px;font-size:12.5px"' +
        (DIRTY.has(i) ? '' : ' disabled') + '>✓ 保存并落图例库</button>' +
    '</div>';

  renderPortRows(i, d);
  wireCard(i, d);
  return d;
}

function renderPortRows(i, d){
  const it = ITEMS[i];
  const box = d.querySelector("#port_rows_" + i);
  box.innerHTML = "";
  const ports = it.ports || [];
  if(!ports.length){
    box.innerHTML = '<div class="prow" style="opacity:.55">'
      + '<span class="idx">—</span>'
      + '<span class="mut" style="font-size:11.5px;font-style:italic">未定义端口'
      + (it.inferred ? '' : '（引擎无法推断，请手工添加）') + '</span></div>';
    return;
  }
  ports.forEach((p, k)=>{
    const r = document.createElement("div"); r.className = "prow";
    r.innerHTML =
      '<span class="idx">' + (k + 1) + '</span>' +
      '<select class="sg">' + sigOpts(p.signal) + '</select>' +
      '<select class="ro">' + selOpts(ROLES, p.role) + '</select>' +
      '<select class="sd">' + selOpts(SIDES, p.side) + '</select>' +
      '<input type="text" class="lb" value="' + esc(p.label || "") + '" placeholder="标签"/>' +
      '<button class="mini" title="减少">−</button><span class="n">' + (p.count || 1) + '</span>' +
      '<button class="mini" title="增加">＋</button>' +
      '<button class="mini del" title="删除">✕</button>';
    const sync = ()=>{
      p.signal = r.querySelector(".sg").value;
      p.role   = r.querySelector(".ro").value;
      p.side   = r.querySelector(".sd").value;
      p.label  = r.querySelector(".lb").value;
      mark(i);
    };
    r.querySelectorAll("select").forEach(s=>s.addEventListener("change", sync));
    r.querySelector(".lb").addEventListener("input", sync);
    r.querySelectorAll("button.mini")[0].addEventListener("click", ()=>{
      p.count = Math.max(1, (p.count || 1) - 1); renderPortRows(i, d); mark(i);
    });
    r.querySelectorAll("button.mini")[1].addEventListener("click", ()=>{
      p.count = (p.count || 1) + 1; renderPortRows(i, d); mark(i);
    });
    r.querySelector("button.mini.del").addEventListener("click", ()=>{
      it.ports.splice(k, 1); renderPortRows(i, d); mark(i);
    });
    box.appendChild(r);
  });
}

function wireCard(i, d){
  /* 手工新增的卡：品牌 / 型号是输入框，得同步回 ITEMS */
  const bi = d.querySelector("#brand_input_"+i);
  const mi = d.querySelector("#model_input_"+i);
  if(bi) bi.addEventListener("input", ()=>{ ITEMS[i].brand = bi.value.trim(); mark(i); identifySuggest(i); });
  if(mi) mi.addEventListener("input", ()=>{ ITEMS[i].model = mi.value.trim(); mark(i); identifySuggest(i); });
  d.querySelector("#cat_sel_"+i).addEventListener("change", ()=>{
    ITEMS[i].category = d.querySelector("#cat_sel_"+i).value || "";
    ITEMS[i]._catTouched = true;   // 用户手动改过类别后，识别建议不再自动覆盖
    mark(i);
  });
  d.querySelector("#addport_"+i).addEventListener("click", ()=>{
    const it = ITEMS[i];
    it.ports = it.ports || [];
    it.ports.push({signal:"XLR", role:"in", side:"left", count:1, label:"", air:false});
    renderPortRows(i, d);
    mark(i);
  });
  d.querySelector("#ok_"+i).addEventListener("click", ()=>saveOne(i));
}

/* R15：手工添加型号时，输入品牌/型号即调用知识库识别，预填类别 + 提示接法 */
let _idTimer = null;
async function identifySuggest(i){
  clearTimeout(_idTimer);
  _idTimer = setTimeout(async () => {
    const it = ITEMS[i]; if(!it) return;
    const brand = it.brand || "", model = it.model || "";
    const el = $("kbh_"+i); if(!el) return;
    if(!model && !brand){ el.className="kbhint"; el.innerHTML=""; return; }
    let kb;
    try { kb = await api("/api/identify", {brand, model, name:""}); }
    catch(e){ el.innerHTML=""; return; }
    if(!kb || !kb.identified){
      el.className = "kbhint unknown";
      el.innerHTML = "📖 知识库无法判定类别，请人工选类别（出图时该型号默认兜底成 IO）。";
      return;
    }
    const conf = kb.confidence < 1
      ? ' <span class="mut">（识别置信 ' + Math.round((kb.confidence||0)*100) + '%）</span>' : "";
    const conn = (kb.upstream||[]).join("/") + " → " + (kb.cn||kb.category) + " → " + (kb.downstream||[]).join("/");
    el.className = "kbhint";
    el.innerHTML = "📖 知识库识别：" + kb.cn + "：" + kb.role +
                   "<br>接法：" + conn + conf;
    /* 用户手动改过类别后不再自动覆盖 */
    const sel = $("cat_sel_"+i);
    if(sel && !it._catTouched && kb.category){
      sel.value = kb.category; it.category = kb.category;
    }
  }, 350);
}

/* 改动标记：刷新徽章 + 元信息 */
function mark(i){
  DIRTY.add(i);
  const c = $("cat_"+i);
  if(!c) return;
  c.classList.add("changed");
  const ok = c.querySelector("#ok_"+i); if(ok) ok.disabled = false;
  const bdg = c.querySelector(".cache");
  if(bdg) bdg.outerHTML = badgeFor(i);
  const kv = c.querySelector(".kv");
  if(kv) kv.innerHTML = metaLine(ITEMS[i]);
}

/* ============================================================
   saveOne() ── 落图例库（/api/legend），落完由 R10 自动反推主库
   ============================================================ */
async function saveOne(i){
  const card = $("cat_"+i);
  if(!card) return;
  const it = ITEMS[i];
  const st = $("st_"+i);
  /* 手工新增的型号必须填型号：图例键是 brand::model::category，
     型号为空会存成 "品牌::_::类别" 这种半截键，永远匹配不上真实设备。 */
  if(!String(it.model || "").trim()){
    st.className="lg-status err"; st.textContent="请先填型号";
    toast("型号不能为空（图例按 品牌::型号::类别 存键）", "err");
    const mi = $("model_input_"+i); if(mi) mi.focus();
    return;
  }
  if(!(it.ports || []).length){
    st.className="lg-status err"; st.textContent="至少加一个端口";
    toast("请先用「+ 新增端口」加至少一个端口", "err");
    return;
  }
  st.className="lg-status"; st.textContent="保存中…";
  const res = await api("/api/legend", {
    brand: it.brand || "", model: it.model || "", category: it.category || "",
    ports: it.ports || [], slots: it.slots || [], note: it.note || "",
  });
  if(res.error){
    st.className="lg-status err"; st.textContent="失败："+res.error;
    toast("保存失败：" + res.error, "err"); return;
  }
  DIRTY.delete(i); SAVED.add(i);
  it.revision = res.revision || 1;
  it.updated_at = res.updated_at || "";
  it.source = "legend";
  card.classList.remove("changed");
  const ok = card.querySelector("#ok_"+i); if(ok) ok.disabled = true;
  const bdg = card.querySelector(".cache");
  if(bdg) bdg.outerHTML = badgeFor(i);
  const kv = card.querySelector(".kv");
  if(kv && res.catalog_item) kv.innerHTML = metaLine(res.catalog_item);
  st.className="lg-status ok";
  st.textContent = res.catalog_synced
    ? "✓ 图例 v" + it.revision + " 已落盘 · 主库已反推" + (res.catalog_backup ? "（备份 "+esc(res.catalog_backup)+"）" : "")
    : "✓ 图例 v" + it.revision + " 已落盘（主库无对应型号，未反推）";
  toast("✓ 已保存 " + (it.model || it.name), "ok");
}

/* ============================================================
   顶部交互
   ============================================================ */
$("brand").addEventListener("change", loadItems);
$("q").addEventListener("input", ()=>{ clearTimeout(window._qt);
  window._qt = setTimeout(loadItems, 280); });
$("fMissing").addEventListener("click", ()=>{
  $("fMissing").classList.toggle("on"); loadItems();
});

/* ============================================================
   + 手工添加型号 ── 给「主库和图例库都没有」的型号建档
   列表 = 图例库 ∪ 主库，两边都没有的型号搜不到，而配单里一旦出现
   它会被兜底成 IO、出图成孤立方块。这里补上最后一个入口。
   ============================================================ */
$("btnAdd").addEventListener("click", ()=>{
  /* 默认类别必须是 IO，不能用 categories[0]（现在是 SOURCE）。
     ★ 理由：引擎对「两库都没有」的型号兜底成 IO（importers.py 的 CATEGORY_KW
       都没命中时），出图时那台设备就是 IO 类别。手工建档要想在下次配单里
       自动套用，类别得跟引擎的兜底一致，否则图例存了也匹配不上。 */
  const cat = (META.categories || []).includes("IO") ? "IO" : ((META.categories || [])[0] || "");
  ITEMS.unshift({
    brand: $("brand").value || "", model: "", name: "", category: cat,
    source: "new", inferred: false, ports: [], slots: [], note: "",
    revision: 0, catalog: null,
  });
  /* 插在最前面 → 其余卡索引整体 +1，DIRTY / SAVED 要跟着平移，
     否则「待保存」标记会错位到别的卡上。 */
  DIRTY = new Set([...DIRTY].map(x => x + 1));
  SAVED = new Set([...SAVED].map(x => x + 1));
  render();
  const el = $("cat_0");
  if(el){
    el.scrollIntoView({behavior:"smooth", block:"center"});
    el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"), 1600);
  }
  const mi = $("model_input_0"); if(mi) mi.focus();
  toast("已插入一条空白图例：填品牌 / 型号 / 类别，加端口后保存", "ok");
});

/* ============================================================
   资料查询抽屉：加载音频知识库 + 分类筛选 + 模糊搜索
   ============================================================ */
const KB = { data:null, loaded:false, filter:"all", q:"" };

async function kbLoad(){
  if(KB.loaded){ return; }
  try{
    const r = await api("/api/kb");
    KB.data = r; KB.loaded = true;
    const n = (r.entries || []).length;
    $("kbMeta").textContent = (r.title || "音频知识库") + " · 共 " + n + " 条";
    const cats = [{id:"all", name:"全部"}].concat(r.categories || []);
    $("kbChips").innerHTML = cats.map(c =>
      `<span class="kb-chip${c.id==="all"?" on":""}" data-cat="${esc(c.id)}">${esc(c.name)}</span>`).join("");
    $("kbChips").querySelectorAll(".kb-chip").forEach(ch=>{
      ch.addEventListener("click", ()=>{
        KB.filter = ch.dataset.cat;
        $("kbChips").querySelectorAll(".kb-chip").forEach(x=>x.classList.remove("on"));
        ch.classList.add("on"); kbRender();
      });
    });
  }catch(e){
    $("kbMeta").textContent = "知识库加载失败（/api/kb）";
  }
  kbRender();
}

/* 模糊评分：整串命中 > 分词命中 > 中文逐字（标题+标签）宽松命中 */
function kbScore(e, q){
  const hay = (e.title + " " + (e.tags||[]).join(" ") + " " + e.summary + " " + e.detail).toLowerCase();
  let s = 0;
  if(hay.indexOf(q) >= 0) s += 60;
  q.split(/\s+/).filter(Boolean).forEach(tok=>{ if(hay.indexOf(tok) >= 0) s += 20; });
  const head = (e.title + " " + (e.tags||[]).join(" ")).toLowerCase();
  for(const ch of q){ if(ch.trim() && head.indexOf(ch) >= 0) s += 3; }
  return s;
}

function kbItem(e){
  const d = document.createElement("div");
  d.className = "kb-item";
  const lvl = (e.tags || []).find(t => t === "ERROR" || t === "WARN" || t === "INFO");
  const lvlHtml = lvl ? ` <span class="lv ${lvl}">${lvl}</span>` : "";
  d.innerHTML =
    '<div class="t">' + esc(e.title) + lvlHtml + '</div>' +
    '<div class="tags">' + (e.tags||[]).slice(0,8).map(t =>
      '<span class="tag">' + esc(t) + '</span>').join("") + '</div>' +
    '<div class="sum">' + esc(e.summary) + '</div>' +
    '<div class="det">' + esc(e.detail) + '</div>';
  d.addEventListener("click", ()=> d.classList.toggle("open"));
  return d;
}

function kbRender(){
  const box = $("kbList");
  if(!KB.data){ box.innerHTML = '<div class="kb-empty">未加载</div>'; return; }
  const q = (KB.q || "").trim().toLowerCase();
  let items = (KB.data.entries || []).filter(e => KB.filter === "all" || e.cat === KB.filter);
  if(q){
    items = items.map(e => ({e, s: kbScore(e, q)})).filter(x => x.s > 0)
                 .sort((a,b)=> b.s - a.s).map(x => x.e);
  }
  if(!items.length){ box.innerHTML = '<div class="kb-empty">没有匹配的知识，换个关键词试试</div>'; return; }
  box.innerHTML = "";
  if(!q && KB.filter !== "all"){
    items.forEach(e => box.appendChild(kbItem(e))); return;
  }
  if(!q && KB.filter === "all"){
    const byCat = {}; (KB.data.categories || []).forEach(c => byCat[c.id] = c.name);
    let last = null;
    items.forEach(e=>{
      const cn = byCat[e.cat] || e.cat;
      if(cn !== last){
        const h = document.createElement("div"); h.className = "kb-cat"; h.textContent = cn;
        box.appendChild(h); last = cn;
      }
      box.appendChild(kbItem(e));
    });
    return;
  }
  items.forEach(e => box.appendChild(kbItem(e)));
}

function kbClose(){
  $("kbDrawer").classList.remove("open");
  $("kbBackdrop").classList.remove("show");
  $("kbDrawer").setAttribute("aria-hidden", "true");
}

$("kbFab").addEventListener("click", ()=>{
  $("kbDrawer").classList.add("open");
  $("kbBackdrop").classList.add("show");
  $("kbDrawer").setAttribute("aria-hidden", "false");
  kbLoad();
  setTimeout(()=>{ try{ $("kbQ").focus(); }catch(_){} }, 280);
});
$("kbClose").addEventListener("click", kbClose);
$("kbBackdrop").addEventListener("click", kbClose);
$("kbQ").addEventListener("input", ()=>{ KB.q = $("kbQ").value; kbRender(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape") kbClose(); });

(async ()=>{ await loadMeta(); await loadItems(); })();
</script>
