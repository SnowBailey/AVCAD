<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AVCAD · 品牌主库校正</title>
<style>
  :root{
    --bg:#03050b; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --txt:#f3f6ff; --mut:#6f7e9a; --acc:#00e5ff; --acc2:#a855f7;
    --ok:#2ee8a0; --err:#ff5a6e; --warn:#f0b45f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
    font-size:13px;line-height:1.6;padding:22px 26px 60px}
  h1{font-size:17px;font-weight:500;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:16px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;
    padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  select,input[type=text]{background:rgba(255,255,255,.06);color:var(--txt);
    border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;font-family:inherit}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--acc)}
  button{cursor:pointer;font-family:inherit;font-size:12px;border-radius:999px;padding:6px 14px;
    border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt)}
  button:hover{border-color:var(--acc);color:#fff}
  button.primary{background:linear-gradient(96deg,rgba(0,229,255,.95),rgba(120,120,255,.9));
    color:#02121a;border:none;font-weight:600}
  button.mini{padding:3px 10px;font-size:11px}
  .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    background:var(--panel)}
  .card.changed{border-color:var(--warn);box-shadow:inset 0 0 0 1px rgba(240,180,95,.18)}
  .card .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
  .card .m{font-weight:600;font-size:14px}
  .card .n{color:var(--mut);font-size:12px}
  .card .sec{color:var(--acc2);font-size:11px}
  .grid{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:start}
  .k{color:var(--mut);font-size:12px;padding-top:5px}
  .feats{display:flex;flex-wrap:wrap;gap:6px}
  .feat{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);font-size:11px;cursor:pointer;user-select:none;color:var(--mut)}
  .feat.on{background:rgba(0,229,255,.14);border-color:var(--acc);color:var(--acc)}
  .pv{display:flex;gap:6px;align-items:center;margin-bottom:5px}
  .pv input{flex:0 0 130px}
  .pv textarea{flex:1;background:rgba(255,255,255,.06);color:var(--txt);
    border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;font-family:inherit;resize:vertical}
  .rowbtn{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
  .st{font-size:11px;color:var(--mut)}
  .st.ok{color:var(--ok)} .st.err{color:var(--err)}
  .params-hint{color:var(--mut);font-size:11px;margin-top:4px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.85);border:1px solid var(--acc);color:#fff;padding:9px 18px;
    border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}
  .empty{color:var(--mut);padding:26px;text-align:center}
</style>
</head>
<body>
<h1>品牌主库校正</h1>
<div class="sub" id="meta">加载中…</div>

<div class="bar">
  <label>品牌
    <select id="brand"></select>
  </label>
  <label>搜索
    <input type="text" id="q" placeholder="型号或名称关键词" size="18"/>
  </label>
  <label class="feat" id="fWireless">只看无线相关</label>
  <span class="st" id="count"></span>
  <span style="flex:1"></span>
  <button class="primary" id="btnSaveAll">保存全部改动</button>
</div>

<div id="list"></div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let META = {categories:[], features:[]};
let ITEMS = [];
let DIRTY = new Set();

async function api(path, body){
  const r = await fetch(path, {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body||{})});
  return await r.json();
}
let tt=null;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"), 2200); }

async function loadMeta(){
  META = await api("/api/catalog", {action:"meta"});
  $("meta").textContent = `主库 ${META.total} 条 · ${META.path}`;
  const sel = $("brand");
  sel.innerHTML = META.brands.map(b =>
    `<option value="${b.brand}">${b.brand}（${b.count}）</option>`).join("");
  sel.value = "IPS";
}

async function loadItems(){
  const res = await api("/api/catalog", {
    action:"list", brand:$("brand").value, q:$("q").value,
    wireless_only: $("fWireless").classList.contains("on")});
  ITEMS = res.items || [];
  DIRTY.clear();
  $("count").textContent = `共 ${ITEMS.length} 条`;
  render();
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const box = $("list");
  if(!ITEMS.length){ box.innerHTML = `<div class="empty">没有匹配的条目</div>`; return; }
  box.innerHTML = ITEMS.map((it,i)=>{
    const catOpts = META.categories.map(c =>
      `<option value="${c}"${c===(it.category||"")?" selected":""}>${c||"（不出图）"}</option>`).join("");
    const feats = META.features.map(f =>
      `<span class="feat${it.features.includes(f)?" on":""}" data-i="${i}" data-f="${f}">${f}</span>`).join("");
    const pvs = Object.entries(it.params||{}).map(([k,v])=>{
      const vs = (typeof v === "object") ? JSON.stringify(v, null, 0) : String(v);
      const multi = (typeof v === "object") || String(v).length > 40;
      return `<div class="pv"><input type="text" value="${esc(k)}" data-i="${i}" class="pk"/>
        ${multi ? `<textarea rows="2" data-i="${i}" class="pval">${esc(vs)}</textarea>`
                : `<textarea rows="1" data-i="${i}" class="pval">${esc(vs)}</textarea>`}
        <button class="mini" data-i="${i}" data-act="delp">删</button></div>`;
    }).join("");
    return `<div class="card" id="card_${i}">
      <div class="hd">
        <span class="m">${esc(it.model)}</span>
        <span class="n">${esc(it.name)}</span>
        <span class="sec">${esc(it.section)}</span>
        ${it.defer_reason?`<span class="st err">后置：${esc(it.defer_reason)}</span>`:""}
      </div>
      <div class="grid">
        <div class="k">类别 category</div>
        <div><select data-i="${i}" class="cat">${catOpts}</select>
          <div class="params-hint">「不出图」= 该型号不进系统图（配件/非音频）</div></div>
        <div class="k">特性 features</div>
        <div class="feats">${feats}</div>
        <div class="k">参数 params</div>
        <div>
          <div id="pvs_${i}">${pvs}</div>
          <div class="rowbtn">
            <button class="mini" data-i="${i}" data-act="addp">+ 参数</button>
            <span class="params-hint">常用：channels / antennas / inputs / outputs / cascade_outs /
              set_expand / ports_override / slots / note</span>
          </div>
        </div>
        <div class="k">备注 remark</div>
        <div><textarea rows="2" data-i="${i}" class="rmk">${esc(it.remark)}</textarea></div>
      </div>
      <div class="rowbtn">
        <button class="mini" data-i="${i}" data-act="save">保存这条</button>
        <span class="st" id="st_${i}"></span>
      </div>
    </div>`;
  }).join("");

  box.querySelectorAll(".cat").forEach(el=>el.addEventListener("change",()=>mark(+el.dataset.i)));
  box.querySelectorAll(".feat").forEach(el=>el.addEventListener("click",()=>{
    el.classList.toggle("on"); mark(+el.dataset.i);
  }));
  box.querySelectorAll(".pk,.pval,.rmk").forEach(el=>
    el.addEventListener("input",()=>mark(+el.dataset.i)));
  box.querySelectorAll("button[data-act]").forEach(b=>{
    const i = +b.dataset.i, act = b.dataset.act;
    if(act==="save") b.addEventListener("click",()=>saveOne(i));
    if(act==="addp") b.addEventListener("click",()=>{
      const wrap = $("pvs_"+i);
      const d = document.createElement("div");
      d.className="pv";
      d.innerHTML = `<input type="text" value="" data-i="${i}" class="pk"/>
        <textarea rows="1" data-i="${i}" class="pval"></textarea>
        <button class="mini" data-i="${i}" data-act="delp">删</button>`;
      wrap.appendChild(d);
      d.querySelectorAll(".pk,.pval").forEach(el=>el.addEventListener("input",()=>mark(i)));
      d.querySelector("button").addEventListener("click",()=>{ d.remove(); mark(i); });
      mark(i);
    });
    if(act==="delp") b.addEventListener("click",()=>{ b.closest(".pv").remove(); mark(i); });
  });
}

function mark(i){ DIRTY.add(i); $("card_"+i).classList.add("changed"); }

function collect(i){
  const card = $("card_"+i);
  const params = {};
  card.querySelectorAll(".pv").forEach(pv=>{
    const k = pv.querySelector(".pk").value.trim();
    if(!k) return;
    let v = pv.querySelector(".pval").value.trim();
    const jp = tryJson(v);
    params[k] = (jp !== undefined) ? jp : coerce(v);
  });
  return {
    idx: ITEMS[i].idx,
    category: card.querySelector(".cat").value,
    features: [...card.querySelectorAll(".feat.on")].map(e=>e.dataset.f),
    params,
    remark: card.querySelector(".rmk").value,
  };
}
function tryJson(s){
  if(!(s.startsWith("{")||s.startsWith("["))) return undefined;
  try{ return JSON.parse(s); }catch(e){ return undefined; }
}
function coerce(v){
  if(v==="") return "";
  if(v==="true") return true; if(v==="false") return false;
  const n = Number(v);
  return (!isNaN(n) && v.trim()!=="") ? n : v;
}

async function saveOne(i){
  const st = $("st_"+i);
  st.className="st"; st.textContent="保存中…";
  const res = await api("/api/catalog", {action:"put", ...collect(i)});
  if(res.error){ st.className="st err"; st.textContent="失败："+res.error; return; }
  DIRTY.delete(i); $("card_"+i).classList.remove("changed");
  st.className="st ok"; st.textContent="已落盘 · 备份 "+res.backup;
  toast("已保存 "+ITEMS[i].model);
}

async function saveAll(){
  const ids=[...DIRTY];
  if(!ids.length){ toast("没有改动"); return; }
  let ok=0, fail=0;
  for(const i of ids){
    const res = await api("/api/catalog", {action:"put", ...collect(i)});
    if(res.error){ fail++; $("st_"+i).className="st err"; $("st_"+i).textContent="失败："+res.error; }
    else { ok++; DIRTY.delete(i); $("card_"+i).classList.remove("changed");
           $("st_"+i).className="st ok"; $("st_"+i).textContent="已落盘"; }
  }
  toast(`保存完成：成功 ${ok} 条${fail?`，失败 ${fail} 条`:""}`);
}

$("brand").addEventListener("change", loadItems);
$("q").addEventListener("input", ()=>{ clearTimeout(window._qt);
  window._qt = setTimeout(loadItems, 300); });
$("fWireless").addEventListener("click", ()=>{
  $("fWireless").classList.toggle("on"); loadItems(); });
$("btnSaveAll").addEventListener("click", saveAll);

(async ()=>{ await loadMeta(); await loadItems(); })();
</script>
</body>
</html>
