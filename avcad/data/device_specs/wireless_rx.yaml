category: WIRELESS_RX
name: 无线接收机
redundancy_allowed: false
features_available: [dante, control, aes, mix_out]
params:
  channels:
    {min: 1, default: 2, label: 接收通道数, unit: "Ch"}
  # 天线接口数：真分集双通道 = 每通道 2 支天线 = 4 口（如 IPS UM2002 系列）
  antennas:
    {min: 1, default: 2, label: 天线接口数, unit: "口"}
ports_template:
  - {name: RF, side: left, signal: RF, role: in, count: 2, count_from: antennas, label: ANT}   # A/B 真分集
  - {name: XLR, side: right, signal: XLR, role: out, count_from: channels, label: OUT}   # 模拟输出(恒有)
  # 6.35mm 混合输出（如 IPS UM2002 系列：二路 XLR 独立 + 一路 6.35 混合）
  - {name: MIX, side: right, signal: TRS, role: out, count: 1, if_feature: mix_out, label: MIX}
  - {name: AES, side: right, signal: AES, role: out, count_from: channels, if_feature: aes, label: AES}
  - {name: DANTE, side: right, signal: DANTE, role: out, count: 1, if_feature: dante, label: DANTE}
  - {name: CTRL, side: right, signal: IP, role: in, count: 1, if_feature: control, label: CTRL}
