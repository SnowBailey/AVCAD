category: SPEAKER_MGR
name: 音箱管理器
redundancy_allowed: false
features_available: [dante, control]
params:
  inputs:
    {min: 1, default: 2, label: 输入路数, unit: "路"}
  outputs:
    {min: 1, default: 8, label: 输出路数, unit: "路"}
ports_template:
  # 音箱管理器不是分区管理器：输出就是普通 OUT（OUT1…），不叫 ZONE
  # （阳哥规则 2026-08-30）。路数取主库 params.outputs，
  # 型号里就写着，如 FIRM4×8 = 4 进 8 出。
  - {name: IN, side: left, signal: XLR, role: in, count_from: inputs, label: IN}
  - {name: DANTE_IN, side: left, signal: DANTE, role: in, count: 1, if_feature: dante, label: DANTE}
  - {name: OUT, side: right, signal: XLR, role: out, count_from: outputs, label: OUT}
  - {name: NET, side: right, signal: IP, role: in, count: 1, if_feature: control, label: NET}
