<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVCAD 型号确认进度表 · IPS → ezacoustics → EAW → Powersoft → Symetrix → AUDIX → YAMAHA</title>
<style>
:root{--bg:#16161a;--panel:#1f1f24;--border:#2c2c33;--text:#e8e6df;--muted:#9a978d;--accent:#378add;--ok:#5dcaa5;--no:#e8655a;--warn:#e8b53c;}
*{box-sizing:border-box}
body{margin:0;font-family:PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px;z-index:10}
h1{margin:0 0 6px;font-size:17px}
.sub{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
input,button{font:inherit;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px 10px;border-radius:6px;outline:none}
input[type=search]{min-width:180px}
button{cursor:pointer;transition:.15s}
button:hover{background:#2a2a30}
button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-ok{color:var(--ok)}
.btn-no{color:var(--no)}
.note{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:inherit;resize:vertical;min-height:48px;margin-top:4px}
.note::placeholder{color:var(--muted)}
.actions button.active{background:var(--ok);border-color:var(--ok);color:#fff}
.actions button.btn-no.active{background:var(--no);border-color:var(--no);color:#fff}
.actions button.btn-block{color:var(--muted)}
.actions button.btn-block.active{background:var(--muted);border-color:var(--muted);color:#16161a}
.progress{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.progress label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bar{width:120px;height:8px;background:var(--panel);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0%}
main{padding:12px 16px 40px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--panel);cursor:pointer;display:flex;align-items:center;gap:8px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .count{font-size:11px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card.ok{border-left:3px solid var(--ok)}
.card.modify{border-left:3px solid var(--no)}
.card.exclude{border-left:3px solid var(--muted)}
.card.pending{border-left:3px solid var(--warn)}
.row-title{display:flex;justify-content:space-between;gap:8px}
.model{font-weight:700;font-size:14px;color:#fff}
.name{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.badge{padding:2px 6px;border-radius:4px;background:#2a2a30;font-size:11px}
.badge.drawable{color:var(--ok)}
.badge.deferred{color:var(--warn)}
.badge.skipped{color:var(--no)}
.actions{display:flex;gap:6px;margin-top:2px}
.actions button{flex:1;padding:5px 8px;font-size:12px}
.preview{height:130px;background:#16161a;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.preview img{max-width:100%;max-height:100%;object-fit:contain}
.preview .missing{color:var(--muted);font-size:11px;text-align:center;padding:10px}
.empty{color:var(--muted);padding:40px;text-align:center}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100}
#lightbox.show{display:flex}
#lightbox img{max-width:90vw;max-height:85vh;background:var(--bg);border-radius:8px}
#lightbox .close{position:absolute;top:16px;right:20px;font-size:26px;color:#fff;cursor:pointer}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
#toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;display:none}
</style>
</head><body>
<header>
<h1>AVCAD 型号确认进度表</h1>
<div class="sub">顺序：IPS → ezacoustics → EAW → Powersoft → Symetrix → AUDIX → YAMAHA。点击操作会实时同步到 WorkBuddy（需先启动 <code>python scripts/review_server.py</code>）；确认无误点「不需要修改」、不出图点「不需要出图」、需修改点「需修改」填说明后点「确认修改」。</div>
<div class="toolbar">
  <input type="search" id="search" placeholder="搜索型号 / 名称">
  <button class="filter active" data-filter="all">全部</button>
  <button class="filter" data-filter="pending">待确认</button>
  <button class="filter" data-filter="ok">不需要修改</button>
  <button class="filter" data-filter="modify">需修改</button>
  <button class="filter" data-filter="exclude">不需要出图</button>
  <button class="filter" data-filter="drawable">仅可出图</button>
  <button class="filter" data-filter="deferred">仅后置</button>
  <button id="copyList">复制修改清单</button>
  <button id="export">导出 JSON</button>
  <button id="importBtn">导入 JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
  <span id="syncStatus" style="color:var(--muted);font-size:12px;margin-left:auto">未连接服务器</span>
</div>
<div class="progress" id="progress"></div>
</header>
<main>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的型号</div>
</main>
<div id="lightbox"><span class="close">&times;</span><img id="lbImg" src=""></div>
<div id="toast"></div>
<footer>
  <span id="footTotal">总计 0 / 0</span>
  <span style="color:var(--muted)">点击预览图可放大查看</span>
</footer>

let state=JSON.parse(localStorage.getItem(LS_KEY)||'{}');
let activeBrand=BRANDS[0], filter='all', query='';

let serverOnline=false;
const API_BASE='http://127.0.0.1:8765';

function save(){localStorage.setItem(LS_KEY,JSON.stringify(state));}
function setLocalStatus(id,s,note){
  if(s==='pending'){delete state[id];}
  else if(s==='ok'){state[id]='ok';}
  else if(s==='modify'){state[id]={modify:true, note: note!=null?note:((state[id]&&state[id].note)||'')};}
  else if(s==='exclude'){state[id]='exclude';}
  save();
}
async function setStatus(id,s,note){
  setLocalStatus(id,s,note);
  const ok=await postAction(id,s,note||'');
  if(!ok) toast('已保存到本地，但未连接 WorkBuddy 服务器');
  render();
}
function parseId(id){const i=id.indexOf('::'); return {brand:id.slice(0,i), model:id.slice(i+2)};}
async function postAction(id, action, note=''){
  const {brand,model}=parseId(id);
  if(!brand||!model) return false;
  try{
    const r=await fetch(API_BASE+'/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand,model,action,note})});
    if(r.ok){setServerStatus(true,'已同步'); return true;}
  }catch(e){}
  setServerStatus(false,'同步失败（已存本地）');
  return false;
}
function setServerStatus(online,text){
  serverOnline=online;
  const el=document.getElementById('syncStatus');
  el.textContent=text;
  el.style.color=online?'var(--ok)':'var(--warn)';
}
async function pingServer(){
  try{const r=await fetch(API_BASE+'/api/state',{method:'GET'}); if(r.ok){setServerStatus(true,'服务器已连接'); return;}}catch(e){}
  setServerStatus(false,'未连接服务器（请先运行 python scripts/review_server.py）');
}
function getStatus(id){
  const v=state[id];
  if(!v) return 'pending';
  if(v==='ok') return 'ok';
  if(v==='exclude') return 'exclude';
  if(v&&typeof v==='object'&&v.modify) return 'modify';
  return 'pending';
}
function getNote(id){const v=state[id]; return (v&&typeof v==='object')? (v.note||'') : '';}
function idOf(m){return m.brand+'::'+m.model;}
function counts(brand){
  const list=MANIFEST[brand]||[];
  let ok=0, modify=0, exclude=0, pending=0;
  list.forEach(m=>{const s=getStatus(idOf(m)); if(s==='ok') ok++; else if(s==='modify') modify++; else if(s==='exclude') exclude++; else pending++;});
  return {total:list.length, ok, modify, exclude, pending};
}
function allCounts(){return BRANDS.reduce((a,b)=>{const c=counts(b); a.total+=c.total; a.ok+=c.ok; a.modify+=c.modify; a.exclude+=c.exclude; a.pending+=c.pending; return a;},{total:0,ok:0,modify:0,exclude:0,pending:0});}
function pct(n,d){return d?Math.round(n/d*100):0;}

function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  BRANDS.forEach(b=>{
    const c=counts(b);
    const tab=document.createElement('div');
    tab.className='tab'+(b===activeBrand?' active':'');
    tab.innerHTML=`<span>${b}</span><span class="count">✓${c.ok} ✎${c.modify} ⊘${c.exclude}/${c.total}</span>`;
    tab.onclick=()=>{activeBrand=b; renderGrid();};
    el.appendChild(tab);
  });
}
function renderProgress(){
  const c=allCounts();
  const done=c.ok+c.modify+c.exclude;
  document.getElementById('footTotal').textContent=`已处理 ${done} / ${c.total}（不需要修改 ${c.ok} · 需修改 ${c.modify} · 不需要出图 ${c.exclude} · 待确认 ${c.pending}）`;
  const el=document.getElementById('progress'); el.innerHTML='';
  BRANDS.forEach(b=>{
    const k=counts(b);
    const done=k.ok+k.modify+k.exclude;
    const p=pct(done,k.total);
    const wrap=document.createElement('label');
    wrap.innerHTML=`<span>${b}</span><div class="bar"><i style="width:${p}%"></i></div><span>${done}/${k.total}</span>`;
    el.appendChild(wrap);
  });
}
function renderGrid(){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const list=(MANIFEST[activeBrand]||[]).filter(m=>{
    const id=idOf(m), s=getStatus(id);
    if(filter==='pending' && s!=='pending') return false;
    if(filter==='ok' && s!=='ok') return false;
    if(filter==='modify' && s!=='modify') return false;
    if(filter==='exclude' && s!=='exclude') return false;
    if(filter==='drawable' && m.status!=='drawable') return false;
    if(filter==='deferred' && (m.status==='drawable'||!m.defer_reason)) return false;

  });

    const id=idOf(m), s=getStatus(id);
    const card=document.createElement('div');

      <div class="name" title="${escapeHtml(m.name)}">${escapeHtml(m.name)}</div>
      <div class="meta">
        <span>${m.category||'—'}</span>
        ${reason?'<span title="'+escapeHtml(reason)+'">'+escapeHtml(reason.substring(0,20))+(reason.length>20?'...':'')+'</span>':''}
      </div>
      <div class="preview" data-svg="${svgUrl||''}">
        ${svgUrl?'<img src="'+svgUrl+'" loading="lazy" alt="">':'<div class="missing">'+escapeHtml(m.error||'无可预览图')+'</div>'}
      </div>
      <div class="actions">
        <button class="btn-ok ${s==='ok'?'active':''}" data-act="ok">不需要修改</button>
        <button class="btn-no ${s==='modify'?'active':''}" data-act="modify">需修改</button>
        <button class="btn-block ${s==='exclude'?'active':''}" data-act="exclude">不需要出图</button>
      </div>
      <div class="modify-area" style="display:${s==='modify'?'block':'none'}">
        <textarea class="note" placeholder="请填写需要修改的内容（端口数/接口类型/名称等），我会逐项改代码">${escapeHtml(getNote(id))}</textarea>
        <button class="confirm-modify" style="width:100%;margin-top:4px;background:var(--no);border-color:var(--no);color:#fff">确认修改</button>
      </div>
    `;
    const btns=card.querySelectorAll('.actions button');
    btns.forEach(btn=>{
      const act=btn.dataset.act;
      btn.onclick=()=>{
        if(act==='modify'){setLocalStatus(id,'modify'); render();}
        else if(act==='ok'){setStatus(id,'ok');}
        else if(act==='exclude'){setStatus(id,'exclude');}
      };
    });
    const ta=card.querySelector('.note');
    if(ta){
      ta.oninput=e=>{state[id]={modify:true, note:e.target.value}; save(); renderProgress(); renderTabs();};
      ta.onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter'){card.querySelector('.confirm-modify').click();}};
    }
    const confirmBtn=card.querySelector('.confirm-modify');
    if(confirmBtn) confirmBtn.onclick=()=>{
      const note=(card.querySelector('.note')?.value||'').trim();
      if(!note){toast('请填写修改说明后再确认'); return;}
      setStatus(id,'modify',note);
    };
    const preview=card.querySelector('.preview');
    if(svgUrl) preview.onclick=()=>openLightbox(svgUrl);
    grid.appendChild(card);
  });
  renderTabs();
  renderProgress();
}
function render(){renderTabs(); renderGrid(); renderProgress();}
function escapeHtml(t){return (t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));}
function openLightbox(url){document.getElementById('lbImg').src=url; document.getElementById('lightbox').classList.add('show');}
function toast(msg){const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2000);}

document.getElementById('search').oninput=e=>{query=e.target.value; renderGrid();};
document.querySelectorAll('.filter').forEach(btn=>btn.onclick=e=>{
  document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active'); filter=e.target.dataset.filter; renderGrid();
});
document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox'||e.target.classList.contains('close')) e.currentTarget.classList.remove('show');};
document.getElementById('copyList').onclick=()=>{
  const items=[];
  BRANDS.forEach(b=>{(MANIFEST[b]||[]).forEach(m=>{const st=getStatus(idOf(m));
    if(st==='modify'){const n=getNote(idOf(m)); items.push(`【需修改】[${m.brand}] ${m.model}（${m.name||''}）— ${n||'(未填写说明)'}`);}
    else if(st==='exclude'){items.push(`【不需要出图】[${m.brand}] ${m.model}（${m.name||''}）`);}
  });});
  if(!items.length){toast('暂无需修改/不需要出图项'); return;}
  const text='待处理型号清单（共 '+items.length+' 项）：\n'+items.join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('已复制 '+items.length+' 项，请粘贴给我'),()=>{window.prompt('请复制以下清单：',text);});} else {window.prompt('请复制以下清单：',text);}
  console.log(text);
};
document.getElementById('export').onclick=()=>{
  const out={};
  BRANDS.forEach(b=>{(MANIFEST[b]||[]).forEach(m=>{const id=idOf(m),s=getStatus(id); if(s!=='pending'){out[id]=(s==='ok')?'ok':(s==='exclude'?'exclude':{modify:true,note:getNote(id)});}});});
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='avcad_model_review.json'; a.click(); toast('已导出');
};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{try{Object.assign(state,JSON.parse(ev.target.result)); save(); render(); toast('已导入');}catch(err){toast('导入失败：'+err.message);}}; r.readAsText(f);
};
render();
pingServer();
setInterval(pingServer, 5000);
</script>
</body></html>
